name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Application checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Install Rust
        run: rustup toolchain install
      - name: Identify the Rust compiler for the cache
        id: rust
        run: echo "version=$(rustc --version | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust dependencies and build output
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-application-${{ steps.rust.outputs.version }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-application-${{ steps.rust.outputs.version }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml', 'rust-toolchain.toml') }}-
      - name: Check repository
        run: pnpm check
      # Tauri embeds the frontend in Rust builds, including tests and Clippy.
      - name: Build desktop frontend
        run: pnpm build:web
      - name: Check Rust formatting and Clippy
        run: pnpm check:rust
      - name: Run Rust unit and real HTTP integration tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
