name: Release

# Pushing a vX.Y.Z tag (pnpm release X.Y.Z) builds every platform and creates a
# draft GitHub release only after all builds succeed. Publishing stays manual.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version and quality gates
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Reject mismatched versions
        run: node scripts/version.mjs check "$GITHUB_REF_NAME"
      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists." >&2
            exit 1
          fi
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The Tauri crate embeds the built frontend, so build it before Rust checks.
      - run: pnpm build:web
      - run: pnpm check:rust
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: macos-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            script: build:macos:arm64
          - target: macos-x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            script: build:macos:x64
          - target: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            script: build:windows
          - target: linux-x64
            # The oldest supported runner keeps the glibc requirement low.
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            script: build:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Install the Rust toolchain and target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.rust-target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.script }}
      - name: Collect release assets
        run: >
          node scripts/release-assets.mjs collect
          "apps/desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          "${{ matrix.target }}" "${GITHUB_REF_NAME#v}" release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Write checksums and the website manifest
        run: node scripts/release-assets.mjs finalize release-assets "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=()
          [[ "$version" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            "${prerelease[@]}" \
            --title "Mayfly $version" \
            --notes-file docs/release-notes.md \
            --generate-notes
