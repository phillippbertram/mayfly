name: Website

on:
  pull_request:
    paths:
      [
        "apps/website/**",
        "package.json",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "tsconfig.base.json",
        "biome.json",
        ".github/workflows/website.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "apps/website/**",
        "package.json",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "tsconfig.base.json",
        "biome.json",
        ".github/workflows/website.yml",
      ]
  release:
    types: [published]
  repository_dispatch:
    types: [filehop-release-published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Pages after the hosting/distribution prerequisites are approved
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
      FILEHOP_RELEASE_REPOSITORY: ${{ vars.FILEHOP_RELEASE_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @filehop/website typecheck
      - run: pnpm exec biome ci --error-on-warnings apps/website
      - run: pnpm test:website
      - run: pnpm build:website
      - run: pnpm --filter @filehop/website check:export
      - name: Disable Jekyll processing
        run: touch apps/website/out/.nojekyll
      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/website/out

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
